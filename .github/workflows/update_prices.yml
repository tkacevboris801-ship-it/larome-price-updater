name: Auto Update Perfume Prices (5 Parallel Shards)

on:
  # 1. Автоматический запуск каждую ночь в 03:00 по Москве (00:00 UTC)
  schedule:
    - cron: '0 0 * * *'
  # 2. Возможность запустить вручную одной кнопкой "Run workflow" во вкладке Actions на GitHub
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Сколько духов проверяет каждый из 5 потоков (5 x 2000 = 10 000 духов)'
        required: false
        default: '2000'

jobs:
  update-prices-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # Запускаем 5 бесплатных серверов GitHub ОДНОВРЕМЕННО (каждый проверяет свою часть базы)
      matrix:
        shard: [0, 1, 2, 3, 4]

    steps:
      - name: Скачиваем код репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Устанавливаем библиотеки и браузер Chromium
        run: |
          pip install supabase playwright beautifulsoup4 python-dotenv
          playwright install --with-deps chromium

      - name: Запускаем обновление цен (Поток ${{ matrix.shard }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RU_PROXY: ${{ secrets.RU_PROXY }}
        run: |
          BATCH=${{ github.event.inputs.batch_size || 2000 }}
          OFFSET=$(( ${{ matrix.shard }} * BATCH ))
          echo "🚀 Запуск потока #${{ matrix.shard }}: offset=$OFFSET, batch=$BATCH"
          xvfb-run --auto-servernum --server-args="-screen 0 1366x900x24" python update_prices.py --offset $OFFSET --batch $BATCH --workers 2
