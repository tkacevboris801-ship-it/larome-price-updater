name: Auto Update Perfume Prices (5 Parallel Shards)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Perfumes per shard (5 x 2000 = 10000)'
        required: false
        default: '2000'

jobs:
  update-prices-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and Chromium
        run: |
          pip install supabase playwright beautifulsoup4 python-dotenv
          playwright install --with-deps chromium

      - name: Run price updater shard ${{ matrix.shard }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RU_PROXY: ${{ secrets.RU_PROXY }}
        run: |
          BATCH=${{ github.event.inputs.batch_size || 2000 }}
          OFFSET=$(( ${{ matrix.shard }} * BATCH ))
          xvfb-run --auto-servernum --server-args="-screen 0 1366x900x24" python update_prices.py --offset $OFFSET --batch $BATCH --workers 2
